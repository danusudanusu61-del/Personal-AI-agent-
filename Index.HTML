<!DOCTYPE html>
<html lang="te">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Personal AI Agent</title>
<style>
  :root {
    --bg: #fafafa; --surface: #ffffff; --border: #e6e6e6;
    --text: #17181a; --text-muted: #6b6f76;
    --accent: #2f6f4f; --accent-soft: #e8f2ec;
    --warn: #a15c00; --warn-soft: #fdf1de;
    --danger: #a13d3d; --danger-soft: #fbecec;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, "Noto Sans Telugu", Roboto, sans-serif; background: var(--bg); color: var(--text); }
  .wrap { max-width: 560px; margin: 0 auto; min-height: 100vh; display: flex; flex-direction: column; }
  header { padding: 18px 16px 6px; }
  header h1 { font-size: 18px; font-weight: 700; margin: 0 0 2px; }
  header p { font-size: 12.5px; color: var(--text-muted); margin: 0; }

  .key-card {
    margin: 10px 16px 0; background: var(--surface); border: 1px solid var(--border);
    border-radius: 10px; padding: 10px 12px;
  }
  .key-card label { font-size: 12px; color: var(--text-muted); display: block; margin-bottom: 4px; }
  .key-card input { width: 100%; border: none; font-size: 14px; outline: none; }

  main { flex: 1; padding: 10px 16px 100px; }

  .input-card {
    background: var(--surface); border: 1px solid var(--border); border-radius: 14px;
    padding: 10px; display: flex; gap: 8px; align-items: flex-end;
    position: sticky; top: 8px; z-index: 5; margin-top: 10px;
  }
  textarea { flex: 1; border: none; resize: none; font-family: inherit; font-size: 15px; line-height: 1.5; max-height: 100px; outline: none; padding: 6px 4px; }
